<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SS7 hexdump → PCAP</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; color:#222; }
  h1 { font-size: 20px; }
  label { display:block; margin: 14px 0 4px; font-weight:600; }
  button { padding: 10px 20px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #download { display:none; margin-top:16px; padding:10px 20px; background:#0a7; color:#fff;
              text-decoration:none; border-radius:4px; }
  #download:hover { background:#085; }
  #log { background:#f5f5f5; padding:12px; border-radius:4px; max-height:320px; overflow:auto;
         font-family:monospace; font-size:12px; white-space:pre-wrap; }
  .hint { color:#666; font-size:13px; }
</style>
</head>
<body>

<h1>SS7 hexdump → PCAP</h1>
<p class="hint">Converts text traces (SIP, H.248, M3UA/SCCP/TCAP hexdumps) into a Wireshark-readable <code>.pcap</code>. IPs/ports come from the record when present; otherwise from the message itself (H.248 MID, MTP3 point codes) or dummy values.</p>

<label>1. Select the trace file</label>
<input type="file" id="file" accept=".txt,.log">

<label>INAP SSN of this environment (SCCP subsystem number of the INAP application / SCP)</label>
<input type="number" id="inapSsn" value="122" min="1" max="254" style="width:90px">
<label>Rewrite INAP SSN to (optional; blank = keep as in trace, 241&ndash;254 decodes in Wireshark without a preference)</label>
<input type="number" id="ssnRewrite" min="1" max="254" style="width:90px">
<label><input type="checkbox" id="rawAll" style="display:inline"> Also include internal/unmapped records as UDP with dummy headers (raw body)</label>
<label>2. Convert</label>
<button id="convert" disabled>Convert → PCAP</button>

<a id="download">⬇ Download .pcap</a>

<label>3. Log</label>
<pre id="log"></pre>

<script>
"use strict";

/* ---------- helpers ---------- */
const log = m => { const e=document.getElementById("log"); e.textContent += m+"\n"; e.scrollTop=e.scrollHeight; };

const parseTs = s => {
  const m = /(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})\.(\d{3})/.exec(s||"");
  return m ? Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6],+m[7])/1000 : Date.now()/1000;
};

const parseAddr = s => { const m=/^\s*([\d.]+)(?::(\d+))?/.exec(s||""); return m?{ip:m[1],port:m[2]?+m[2]:0}:null; };
const ipBytes = ip => ip.split(".").map(n=>+n);

/* ---------- CRC32c for SCTP checksum ---------- */
const CRC_TABLE = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0x82f63b78^(c>>>1):c>>>1;t[n]=c>>>0;}
  return t;})();
const crc32c = buf => { let c=0xffffffff;
  for(let i=0;i<buf.length;i++) c=(CRC_TABLE[(c^buf[i])&0xff]^(c>>>8))>>>0;
  return (c^0xffffffff)>>>0; };

/* ---------- record parser ---------- */
function parseRecords(text){
  const chunks = text.split(/\r?\n=+\r?\n/);
  const out = [];
  for(const chunk of chunks){
    if(!/\[No\.\s*\]/.test(chunk)) continue;
    const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const field = name => {
      const m = new RegExp("\\["+esc(name)+"\\s*\\]\\s*([^\\r\\n]*)").exec(chunk);
      return m ? m[1].trim() : "";
    };
    const rec = {
      ts:    field("TimeStamp"),
      iface: field("Msg Interface"),
      type:  field("Msg Type"),
      src:   field("Source Address"),
      dst:   field("Destination Address"),
    };
    const lines = chunk.split(/\r?\n/);
    let bodyIndex = -1;
    let inlineBody = "";
    for(let i = 0; i < lines.length; i++){
      const m = /^\s*\[Msg Body\s*\]\s*(.*)$/.exec(lines[i]);
      if(m){ bodyIndex = i; inlineBody = m[1].trim(); break; }
    }
    // Huawei PTMF writes the complete hex payload on the SAME line as
    // [Msg Body]. Keep that payload; older exports may put it on following
    // lines, so retain those too.
    rec.bodyLines = [];
    if(inlineBody) rec.bodyLines.push(inlineBody);
    if(bodyIndex >= 0) rec.bodyLines.push(...lines.slice(bodyIndex + 1));
    out.push(rec);
  }
  return out;
}

/* ---------- body interpreters ---------- */
const HEXDUMP_LINE = /^\s*\d+>\s*(.*)$/;
function extractHexdump(lines){
  const bytes=[];
  for(const ln of lines){
    const numbered = HEXDUMP_LINE.exec(ln);
    const data = numbered ? numbered[1] : ln.trim();
    if(!data) continue;
    const tokens = data.split(/\s+/);
    if(numbered){
      // Numbered hexdump rows may include an ASCII column after the bytes.
      for(const t of tokens){
        if(!/^[0-9A-Fa-f]{2}$/.test(t)) break;
        bytes.push(parseInt(t,16));
      }
    } else if(tokens.every(t => /^[0-9A-Fa-f]{2}$/.test(t))){
      // PTMF export: one space-separated hex string after [Msg Body].
      for(const t of tokens) bytes.push(parseInt(t,16));
    }
  }
  return bytes.length ? new Uint8Array(bytes) : null;
}

function isSIPMessage(lines){
  for(const ln of lines){ const t=ln.trim(); if(!t) continue;
    return /^(INVITE|ACK|BYE|CANCEL|REGISTER|OPTIONS|INFO|UPDATE|PRACK|REFER|SUBSCRIBE|NOTIFY|MESSAGE|SIP\/2\.0)\b/.test(t); }
  return false;
}

function sipBytes(lines){
  const text = lines.join("\r\n").replace(/(\r\n)+$/,"") + "\r\n\r\n";
  return new TextEncoder().encode(text);
}

/* ---------- L2/L3/L4 builders ---------- */
function eth(srcMac,dstMac,payload){
  const b=new Uint8Array(14+payload.length);
  b.set(dstMac,0); b.set(srcMac,6); b[12]=0x08; b[13]=0x00; b.set(payload,14); return b;
}
function ipv4(src,dst,proto,payload){
  const b=new Uint8Array(20+payload.length); b[0]=0x45;
  const len=20+payload.length; b[2]=(len>>>8)&0xff; b[3]=len&0xff;
  b[8]=64; b[9]=proto; b.set(ipBytes(src),12); b.set(ipBytes(dst),16);
  let s=0; for(let i=0;i<20;i+=2) s+=(b[i]<<8)|b[i+1];
  while(s>>>16) s=(s&0xffff)+(s>>>16);
  s=~s&0xffff; b[10]=(s>>>8)&0xff; b[11]=s&0xff; b.set(payload,20); return b;
}
function udp(sp,dp,payload){
  const b=new Uint8Array(8+payload.length);
  b[0]=(sp>>>8)&0xff; b[1]=sp&0xff; b[2]=(dp>>>8)&0xff; b[3]=dp&0xff;
  const len=8+payload.length; b[4]=(len>>>8)&0xff; b[5]=len&0xff; b.set(payload,8); return b;
}

/* ---------- SCTP with monotonic TSN ---------- */
let sctpTSN = 0;
function sctp(sp, dp, ppid, payload){
  const dataLen  = 16 + payload.length;
  const chunkLen = dataLen;
  const pad      = (4 - (dataLen % 4)) % 4;
  const b = new Uint8Array(12 + chunkLen + pad);
  b[0]=(sp>>>8)&0xff; b[1]=sp&0xff;
  b[2]=(dp>>>8)&0xff; b[3]=dp&0xff;
  b[4]=0; b[5]=0; b[6]=0; b[7]=1;
  let o = 12;
  b[o++]=0; b[o++]=0x03;
  b[o++]=(chunkLen>>>8)&0xff; b[o++]=chunkLen&0xff;
  const tsn = ++sctpTSN;
  b[o++]=(tsn>>>24)&0xff; b[o++]=(tsn>>>16)&0xff;
  b[o++]=(tsn>>>8)&0xff;  b[o++]=tsn&0xff;
  b[o++]=0; b[o++]=0;
  b[o++]=0; b[o++]=0;
  b[o++]=(ppid>>>24)&0xff; b[o++]=(ppid>>>16)&0xff;
  b[o++]=(ppid>>>8)&0xff;  b[o++]=ppid&0xff;
  b.set(payload,o);
  const cs = crc32c(b);
  // CRC32c is a reflected CRC: its bytes go on the wire least-significant first.
  b[8]=cs&0xff; b[9]=(cs>>>8)&0xff;
  b[10]=(cs>>>16)&0xff; b[11]=(cs>>>24)&0xff;
  return b;
}

/* ---------- M3UA DATA (with mandatory Protocol Data TLV) ---------- */
function m3uaData(payload, opc, dpc, si, ni, sls=0, mp=0){
  const pdValueLen = 12 + payload.length;
  const pdParamLen = 4 + pdValueLen;
  // M3UA parameters are padded to a 32-bit boundary. The parameter's
  // Length field excludes padding, while the common-header Message Length
  // includes it.
  const pdPadding  = (4 - (pdParamLen % 4)) % 4;
  const msgLen     = 8 + pdParamLen + pdPadding;
  const b = new Uint8Array(msgLen); // zero-initialized padding

  b[0]=1; b[1]=0; b[2]=1; b[3]=1;
  b[4]=(msgLen>>>24)&0xff; b[5]=(msgLen>>>16)&0xff;
  b[6]=(msgLen>>>8)&0xff;  b[7]= msgLen&0xff;

  // Protocol Data parameter
  b[8]=0x02; b[9]=0x10;
  b[10]=(pdParamLen>>>8)&0xff; b[11]=pdParamLen&0xff;

  // OPC / DPC
  b[12]=(opc>>>24)&0xff; b[13]=(opc>>>16)&0xff; b[14]=(opc>>>8)&0xff; b[15]=opc&0xff;
  b[16]=(dpc>>>24)&0xff; b[17]=(dpc>>>16)&0xff; b[18]=(dpc>>>8)&0xff; b[19]=dpc&0xff;
  // SI / NI / MP / SLS
  b[20]=si; b[21]=ni; b[22]=mp; b[23]=sls;
  b.set(payload, 24);
  return b;
}

/* ---------- pcap writer ---------- */
function writePcap(packets){
  const total = 24 + packets.reduce((a,p)=>a+16+p.data.length,0);
  const buf = new ArrayBuffer(total);
  const dv = new DataView(buf); const u8 = new Uint8Array(buf);
  let o = 0;
  dv.setUint32(o, 0xa1b2c3d4, true); o+=4;
  dv.setUint16(o, 2, true); o+=2;
  dv.setUint16(o, 4, true); o+=2;
  dv.setInt32(o, 0, true);  o+=4;
  dv.setUint32(o, 0, true); o+=4;
  dv.setUint32(o, 65535, true); o+=4;
  dv.setUint32(o, 1, true); o+=4; // LINKTYPE_ETHERNET
  for(const p of packets){
    const s = Math.floor(p.ts), us = Math.floor((p.ts - s)*1e6);
    dv.setUint32(o, s, true); o+=4;
    dv.setUint32(o, us, true); o+=4;
    dv.setUint32(o, p.data.length, true); o+=4;
    dv.setUint32(o, p.data.length, true); o+=4;
    u8.set(p.data, o); o += p.data.length;
  }
  return buf;
}

const MAC_A = new Uint8Array([0x02,0,0,0,0,0x01]);
const MAC_B = new Uint8Array([0x02,0,0,0,0,0x02]);
// Dummy defaults used whenever the record carries no usable address.
const DUMMY = { src:"10.255.0.1", dst:"10.255.0.2", sport:40000, dport:40001 };
const macFor = ip => new Uint8Array([0x02,0,...ipBytes(ip)]);   // stable synthetic MAC per IP
const isIp = s => /^\d{1,3}(\.\d{1,3}){3}$/.test(s||"");
function ethFor(srcIp,dstIp,l3){ return eth(macFor(srcIp), macFor(dstIp), l3); }

/* ---------- wrap an SCCP UDT chunk into M3UA/SCTP/IP/Eth ---------- */
function pointCodeToIp(pc){
  // Stable synthetic IPv4 address derived from the 24-bit MTP3 point code.
  return "10." + ((pc >>> 16) & 0xff) + "." + ((pc >>> 8) & 0xff) + "." + (pc & 0xff);
}
function wrapSCCP(sccpUdt, opc=1, dpc=2, sls=0, ni=2, mp=0, si=3){
  const m3ua = m3uaData(sccpUdt, opc, dpc, si, ni, sls, mp);
  const l4   = sctp(2905, 2905, 3, m3ua);               // PPID=3 (M3UA)
  const l3   = ipv4(pointCodeToIp(opc), pointCodeToIp(dpc), 132, l4);
  return eth(MAC_A, MAC_B, l3);
}

/* ---------- find the protocol-class byte (0x80..0x83) followed by valid pointers ---------- */
function findSCCPProtoClass(bytes, startSearch){
  for(let i = startSearch; i < bytes.length - 4; i++){
    const pc = bytes[i];
    if(pc < 0x80 || pc > 0x83) continue;
    const p1 = bytes[i+1], p2 = bytes[i+2], p3 = bytes[i+3];
    if(p1 >= 3 && p1 <= 15 &&
       p2 >= p1 + 3 && p2 <= 40 &&
       p3 >= p2 + 3 && p3 <= 80){
      return i;
    }
  }
  return -1;
}

/* ---------- INAP application-context identification ---------- */
// INAP application-context seen in the Huawei trace: 0.3.4605.1.1.1.x => 06 08 03 A3 7D 01 01 01 ...
// (0.0.17.773.1.1.1 = 06 07 00 11 86 05 01 01 01 is only the TCAP dialogue AS-ID, present in every dialogue.)
const INAP_CS2_OID = new Uint8Array([0x06,0x08,0x03,0xa3,0x7d,0x01,0x01,0x01]);
function hasInapApplicationContext(bytes){
  if(!bytes) return false;
  outer: for(let i=0;i<=bytes.length-INAP_CS2_OID.length;i++){
    for(let j=0;j<INAP_CS2_OID.length;j++){
      if(bytes[i+j]!==INAP_CS2_OID[j]) continue outer;
    }
    return true;
  }
  return false;
}


/* ---------- SCCP SSNs (called, calling) of a UDT ---------- */
let cfg = { ssn:122, rewrite:null };
function ssnOffsets(u){           // byte offsets of the SSN in called/calling address
  const out = [];
  for(const ptrIdx of [2,3]){
    const o = ptrIdx + u[ptrIdx];
    if(o + 2 >= u.length) continue;
    const ind = u[o+1];
    if(ind & 0x02) out.push(o + 2 + ((ind & 0x01) ? 2 : 0));
  }
  return out;
}
const sccpSsns = u => ssnOffsets(u).map(o => u[o]);
// INAP = application context OR dialogue tracking OR either SCCP address uses the SSN entered in the UI.
// Returns {inap, ssns}; optionally rewrites the SSN in place (must run before SCTP checksum is computed).
function classifyInap(sccp, tcap, dialogs){
  let inap = tcap ? trackInapDialogue(tcap, dialogs) : false;
  if(tcap && !inap && sccpSsns(sccp).includes(cfg.ssn)) inap = true;
  const ssns = inap ? sccpSsns(sccp) : [];
  if(inap && cfg.rewrite != null) for(const o of ssnOffsets(sccp)) if(sccp[o] === cfg.ssn) sccp[o] = cfg.rewrite;
  return { inap, ssns };
}

/* ---------- TCAP extraction and INAP dialogue tracking ---------- */
function berLength(bytes, offset){
  if(offset >= bytes.length) return null;
  const first = bytes[offset];
  if(first < 0x80) return { length:first, next:offset+1 };
  const count = first & 0x7f;
  if(count === 0 || count > 4 || offset + 1 + count > bytes.length) return null;
  let length = 0;
  for(let i=0;i<count;i++) length = (length * 256) + bytes[offset+1+i];
  return { length, next:offset+1+count };
}
function extractTcapFromSccpUdt(sccp){
  if(!sccp || sccp.length < 6 || sccp[0] !== 0x09) return null;
  const dataPointer = sccp[4];
  const lengthOffset = 4 + dataPointer;
  if(lengthOffset >= sccp.length) return null;
  const dataLength = sccp[lengthOffset];
  const start = lengthOffset + 1;
  if(start + dataLength > sccp.length || dataLength < 2) return null;
  const tcap = sccp.subarray(start, start + dataLength);
  return [0x61,0x62,0x64,0x65,0x67].includes(tcap[0]) ? tcap : null;
}
function parseTcapTransactionIds(tcap){
  if(!tcap || tcap.length < 2) return null;
  const outer = berLength(tcap,1);
  if(!outer) return null;
  let pos = outer.next;
  const end = Math.min(tcap.length, pos + outer.length);
  let otid = null, dtid = null;
  while(pos + 2 <= end){
    const tag = tcap[pos++];
    const l = berLength(tcap,pos);
    if(!l || l.next + l.length > end) break;
    if(tag === 0x48) otid = Array.from(tcap.subarray(l.next,l.next+l.length)).map(x=>x.toString(16).padStart(2,"0")).join("");
    if(tag === 0x49) dtid = Array.from(tcap.subarray(l.next,l.next+l.length)).map(x=>x.toString(16).padStart(2,"0")).join("");
    pos = l.next + l.length;
  }
  return { type:tcap[0], otid, dtid };
}
function trackInapDialogue(tcap, dialogs){
  const ids = parseTcapTransactionIds(tcap);
  if(!ids) return false;
  const oidPresent = hasInapApplicationContext(tcap);
  let isInap = oidPresent;
  if(ids.type === 0x62 || ids.type === 0x61){
    if(ids.otid) dialogs.set(ids.otid,oidPresent);
    return isInap;
  }
  if(ids.type === 0x65){
    if(ids.dtid && dialogs.get(ids.dtid)) isInap = true;
    if(ids.otid && isInap) dialogs.set(ids.otid,true);
    return isInap;
  }
  if(ids.type === 0x64 || ids.type === 0x67){
    if(ids.dtid && dialogs.get(ids.dtid)) isInap = true;
    // Keep the transaction ID for the remainder of this trace. Some Huawei
    // captures expose both terminal indications for the same dialogue.
    return isInap;
  }
  return isInap;
}

/* ---------- H.248 helpers ---------- */
let h248Peers = {};
function findH248Ber(b){          // [len16][30 ...] where len16 == remaining bytes
  for(let i=16;i<Math.min(b.length-3,128);i++)
    if(b[i+2]===0x30 && ((b[i]<<8)|b[i+1]) === b.length-i-2) return i+2;
  return -1;
}
function midOf(ber){              // first ip4Address {[0] 4 octets, [1] port} inside the message
  for(let i=0;i<Math.min(ber.length-12,64);i++)
    if(ber[i]===0xa0 && ber[i+2]===0x80 && ber[i+3]===4 && ber[i+8]===0x81 && ber[i+9]===2)
      return { ip: Array.from(ber.subarray(i+4,i+8)).join("."), port: (ber[i+10]<<8)|ber[i+11] };
  return null;
}

/* ---------- record -> packet ---------- */
function buildPacket(rec, tcapDialogs){
  const iface = rec.iface || "";
  const body  = rec.bodyLines;
  if(!body.length) return null;

  const marker = (body.find(l => l.trim()) || "").trim();
  const bytes  = extractHexdump(body);

  // 1) SIP over UDP. Huawei PTMF exports can store SIP as ASCII hex bytes,
  //    while other supported exports contain the SIP text directly.
  const decodedHex = bytes ? new TextDecoder().decode(bytes) : "";
  const sipIsHex = !!bytes && isSIPMessage([decodedHex]);
  if(/FROM_SIP|TO_SIP/.test(iface) && (isSIPMessage(body) || sipIsHex)){
    const sa = parseAddr(rec.src) || {ip:DUMMY.src, port:5060};
    const da = parseAddr(rec.dst) || {ip:DUMMY.dst, port:5060};
    const p  = sipIsHex ? bytes : sipBytes(body);
    const l4 = udp(sa.port||5060, da.port||5060, p);
    const l3 = ipv4(sa.ip, da.ip, 17, l4);
    return { kind: "sip", data: ethFor(sa.ip, da.ip, l3) };
  }

  // 1b) H.248 (BER) over UDP/2945. Record = module header + [len16][BER MegacoMessage].
  //     Sender MID (ip4Address) gives the MGC/MGW IP:port; the peer is learned from the opposite direction.
  if(/TO_H248|FROM_H248/.test(iface) && bytes){
    const ber = findH248Ber(bytes);
    if(ber >= 0){
      const toMgw = /TO_H248/.test(iface);
      const mid = midOf(bytes.subarray(ber));
      if(mid) h248Peers[toMgw ? "mgc" : "mgw"] = mid;
      const mgc = h248Peers.mgc || {ip:DUMMY.src, port:2945};
      const mgw = h248Peers.mgw || {ip:DUMMY.dst, port:2945};
      const s = toMgw ? mgc : mgw, d = toMgw ? mgw : mgc;
      const l4 = udp(s.port||2945, d.port||2945, bytes.subarray(ber));
      return { kind:"h248", data: ethFor(s.ip, d.ip, ipv4(s.ip, d.ip, 17, l4)) };
    }
  }

  // 1c) Real M3UA DATA captured at the linkset (carries true NI/SLS). Point codes -> synthetic IPs.
  if(iface === "TRC_MI_M3UA_LINKSET"){
    if(!bytes || bytes.length < 24 || bytes[0] !== 1 || bytes[2] !== 1 || bytes[3] !== 1) return null;
    const pc = o => ((bytes[o]<<24)|(bytes[o+1]<<16)|(bytes[o+2]<<8)|bytes[o+3])>>>0;
    const s = pointCodeToIp(pc(12)), d = pointCodeToIp(pc(16));
    const sccp = bytes.subarray(24), tcap = extractTcapFromSccpUdt(sccp);
    const { inap, ssns } = classifyInap(sccp, tcap, tcapDialogs);
    const l3 = ipv4(s, d, 132, sctp(2905, 2905, 3, bytes));
    return { kind: tcap ? "tcap" : "m3ua", inap, ssns, data: ethFor(s, d, l3) };
  }

  // 2) M3UA already on the wire
  if(marker === "M3UAMessage"){
    if(!bytes) return null;
    const l4 = sctp(2905, 2905, 3, bytes);
    const l3 = ipv4("10.0.0.1", "10.0.0.2", 132, l4);
    return { kind: "m3ua", data: eth(MAC_A, MAC_B, l3) };
  }

  // 3) Huawei PTMF network-side SCCP trace:
  //    TRC_MI_SCCPDPC_MSG / UDT carries a 12-byte trace/MTP3 prefix,
  //    followed by the actual SCCP UDT (0x09) and its TCAP BER payload.
  //    Emit only this network-facing record; TCAPUSER/CAP and TCAPSCCP
  //    records are internal stack views of the same signalling exchange.
  if(iface === "TRC_MI_SCCPDPC_MSG" && rec.type === "UDT"){
    if(!bytes || bytes.length <= 12 || bytes[12] !== 0x09) return null;
    const sccpUdt = bytes.subarray(12);
    // Huawei's 12-byte SCCPDPC prefix carries the 24-bit OPC and DPC
    // in bytes 6..8 and 9..11, followed by the SCCP UDT at byte 12.
    const opc = (bytes[6] << 16) | (bytes[7] << 8) | bytes[8];
    const dpc = (bytes[9] << 16) | (bytes[10] << 8) | bytes[11];
    const sls = bytes[5];
    // MTP3 SIO: NI occupies bits 7..6, priority/MP bits 5..4,
    // and service indicator/SI bits 3..0. Preserve the values from
    // the trace instead of forcing every reconstructed packet to NI=0.
    const sio = bytes[1];
    const ni = (sio >>> 6) & 0x03;
    const mp = (sio >>> 4) & 0x03;
    const si = sio & 0x0f;
    const tcap = extractTcapFromSccpUdt(sccpUdt);
    const { inap, ssns } = classifyInap(sccpUdt, tcap, tcapDialogs);
    return {
      kind: "tcap",
      inap,
      ssns,
      data: wrapSCCP(sccpUdt, opc, dpc, sls, ni, mp, si)
    };
  }

  // 4) MTP3Msg: [6-byte MTP3 hdr][SCCP UDT starting with 0x09]
  if(marker === "MTP3Msg"){
    if(!bytes || bytes.length <= 6) return null;
    return { kind: "m3ua", data: wrapSCCP(bytes.subarray(6)) };
  }

  // 5) SCCPMessage: [12-byte trace hdr][SCCP UDT starting with 0x09]
  if(marker === "SCCPMessage"){
    if(!bytes || bytes.length <= 12) return null;
    return { kind: "m3ua", data: wrapSCCP(bytes.subarray(12)) };
  }

  // 6) SCCPUSERMessage / TCAPSCCPMessage:
  //    N-UNITDATA wrapper + SCCP UDT whose 0x09 (UDT) byte is not shown.
  //    Find the protocol-class byte and rebuild: [09][protocol-class][ptrs]...
  if(marker === "SCCPUSERMessage" || marker === "TCAPSCCPMessage"){
    if(!bytes) return null;
    const pc = findSCCPProtoClass(bytes, 5);
    if(pc < 0) return null;
    const rest = bytes.subarray(pc);
    const sccpUdt = new Uint8Array(1 + rest.length);
    sccpUdt[0] = 0x09;         // UDT message-type indicator
    sccpUdt.set(rest, 1);
    return { kind: "m3ua", data: wrapSCCP(sccpUdt) };
  }

  return null;
}

/* ---------- main ---------- */
function convert(text){
  sctpTSN = 0;
  const num = id => { const e = document.getElementById(id), v = e && parseInt(e.value, 10); return Number.isInteger(v) && v >= 1 && v <= 254 ? v : null; };
  cfg = { ssn: num("inapSsn") || 122, rewrite: num("ssnRewrite") };
  const recs = parseRecords(text);
  log("Records parsed: " + recs.length);

  const packets = [];
  let sipN = 0, m3uaN = 0, tcapN = 0, inapN = 0, skipN = 0;

  const tcapDialogs = new Map();
  // Pre-pass: learn H.248 MGC/MGW endpoints and the SCCP payloads already carried by real M3UA records.
  h248Peers = {};
  const lsSccp = [];
  for(const r of recs){
    if(/H248/.test(r.iface) && r.iface[0] !== "T"){
      const b = extractHexdump(r.bodyLines), o = b ? findH248Ber(b) : -1, m = o >= 0 ? midOf(b.subarray(o)) : null;
      if(m) h248Peers[/TO_H248/.test(r.iface) ? "mgc" : "mgw"] = m;
    }
    if(r.iface === "TRC_MI_M3UA_LINKSET"){ const b = extractHexdump(r.bodyLines); if(b) lsSccp.push(b.subarray(24)); }
  }
  const rawAll = document.getElementById("rawAll") && document.getElementById("rawAll").checked;
  let h248N = 0, rawN = 0;
  const inapSsns = new Set();
  for(const r of recs){
    // SCCPDPC UDT duplicates the M3UA linkset record (same SCCP bytes) -> keep only the M3UA one.
    if(r.iface === "TRC_MI_SCCPDPC_MSG"){
      const b = extractHexdump(r.bodyLines);
      if(b && b.length > 12){
        const u = b.subarray(12);   // M3UA pads to 4 bytes, so compare as prefix + <=3 zero pad bytes
        if(lsSccp.some(l => l.length >= u.length && l.length - u.length < 4 && u.every((x,i) => x === l[i]))){ skipN++; continue; }
      }
    }
    let p = buildPacket(r, tcapDialogs);
    if(!p && rawAll){            // dummy-header fallback: raw body as UDP
      const b = extractHexdump(r.bodyLines);
      if(b){ const l4 = udp(DUMMY.sport, DUMMY.dport, b); p = { kind:"raw", data: ethFor(DUMMY.src, DUMMY.dst, ipv4(DUMMY.src, DUMMY.dst, 17, l4)) }; rawN++; }
    }
    if(!p){ skipN++; continue; }
    if(p.kind === "h248") h248N++;
    if(p.ssns) p.ssns.forEach(s => inapSsns.add(s));
    packets.push({ ts: parseTs(r.ts), data: p.data });
    if(p.kind === "sip")       sipN++;
    else if(p.kind === "raw")  { /* counted in rawN */ }
    else if(p.kind === "h248") { /* counted in h248N */ }
    else if(p.kind === "tcap"){
      tcapN++;
      if(p.inap) inapN++;
    } else m3uaN++;
  }

  log("SIP packets       : " + sipN);
  log("SS7 packets (M3UA): " + m3uaN);
  log("TCAP packets       : " + tcapN);
  log("INAP CS2 packets   : " + inapN);
  log("H.248 packets     : " + h248N);
  log("Raw/dummy packets  : " + rawN);
  log("Skipped           : " + skipN);
  log("Total packets     : " + packets.length);
  log("----");
  log("TCAP/CAP BER payloads are preserved inside SCCP user data.");
  log("Wireshark filter: sip || h248 || m3ua || sccp || tcap || gsm_map || inap || camel");
  if(inapN){
    const seen = Array.from(inapSsns).sort((a,b)=>a-b).join(",");
    log("SSNs seen on INAP packets: " + seen + "   (INAP SSN entered: " + cfg.ssn + ")");
    if(!inapSsns.has(cfg.ssn)) log("WARNING: entered SSN was not seen on any INAP packet - check the value.");
    if(cfg.rewrite != null){
      log("INAP SSN " + cfg.ssn + " rewritten to " + cfg.rewrite + " in the pcap.");
      if(cfg.rewrite < 241 || cfg.rewrite > 254) log("Wireshark: INAP > Subsystem numbers = " + cfg.rewrite + "  (default INAP range is 241-254)");
    } else {
      log("Wireshark: Edit > Preferences > Protocols > INAP > Subsystem numbers = " + cfg.ssn + "   (or: tshark -o inap.ssn:" + cfg.ssn + " -r file.pcap)");
    }
  }

  return writePcap(packets);
}

/* ---------- UI ---------- */
const fileEl = document.getElementById("file");
const btnEl  = document.getElementById("convert");
const dlEl   = document.getElementById("download");

fileEl.onchange = () => {
  btnEl.disabled = !fileEl.files[0];
  document.getElementById("log").textContent = "";
  dlEl.style.display = "none";
};

btnEl.onclick = async () => {
  const f = fileEl.files[0]; if(!f) return;
  btnEl.disabled = true;
  log("Reading " + f.name + " (" + f.size + " bytes) ...");
  try {
    const text = await f.text();
    log("Converting ...");
    const pcap = convert(text);
    const blob = new Blob([pcap], { type: "application/vnd.tcpdump.pcap" });
    dlEl.href = URL.createObjectURL(blob);
    dlEl.download = f.name.replace(/\.(txt|log)$/i,"") + ".pcap";
    dlEl.style.display = "inline-block";
    dlEl.textContent = "⬇ Download " + dlEl.download;
    log("Done.");
  } catch(e){
    log("ERROR: " + e.message);
    console.error(e);
  } finally {
    btnEl.disabled = false;
  }
};
